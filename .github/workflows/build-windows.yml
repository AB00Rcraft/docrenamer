# Сборка portable-дистрибутива для Windows (разделы 70, 88 ТЗ).
#
# Здесь собирается то, что нельзя собрать на Linux: PyInstaller не умеет
# кросс-компиляцию, исполняемый файл Windows создаётся только на Windows.
#
# Как получить готовый DocRenamer.exe:
#   1. Загрузить репозиторий на GitHub.
#   2. Вкладка Actions → «Сборка для Windows» → Run workflow.
#   3. По завершении скачать артефакт DocRenamer-onefile (один файл .exe)
#      или DocRenamer-portable (каталог по раскладке раздела 4 ТЗ).
#
# Публикация релиза: создать тег вида v1.0.0 — файлы прикрепятся к релизу.

name: Сборка для Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Установить Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Установить зафиксированные зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          pip install pyinstaller reportlab pytest pytest-timeout ruff
          pip install -e .

      - name: Версия в коде совпадает с тегом
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $code = (python -c "import docrenamer; print(docrenamer.__version__)").Trim()
          $tag = "${{ github.ref_name }}".TrimStart("v")
          Write-Host "версия в коде: $code, тег: $tag"
          if ($code -ne $tag) {
            throw "Версия в коде ($code) не совпадает с тегом ($tag). Обновление будет работать неверно."
          }

      - name: Тесты
        env:
          # Короткий временный каталог: длинные русские имена в стандартном
          # %TEMP% упираются в ограничение пути Windows в 260 символов.
          TEMP: C:\t
          TMP: C:\t
        run: |
          New-Item -ItemType Directory -Force -Path C:\t | Out-Null
          python -m pytest -q

      - name: Аудит офлайн-режима
        run: python -m docrenamer.security.offline_guard --audit src/docrenamer

      - name: Проверка стиля
        run: python -m ruff check src tests

      - name: Сборка portable-каталога
        run: python -m PyInstaller DocRenamer.spec --noconfirm

      - name: Сборка программы обновления
        run: >
          python -m PyInstaller
          --noconfirm --onefile --console
          --name DocRenamerUpdate
          --paths src
          src/docrenamer_updater/__main__.py
          --distpath dist/updater --workpath build/updater --specpath build

      - name: Сборка одного файла
        env:
          DOCRENAMER_ONEFILE: "1"
        run: >
          python -m PyInstaller DocRenamer.spec --noconfirm
          --distpath dist/onefile --workpath build/onefile

      - name: Вложить распознавание сканов
        shell: pwsh
        run: |
          # Tesseract кладётся внутрь дистрибутива, чтобы сканы читались сразу,
          # без ручной доустановки. Программа его не скачивает — он приезжает
          # вместе со сборкой.
          choco install tesseract --no-progress -y | Out-Null
          $source = "C:\Program Files\Tesseract-OCR"
          if (-not (Test-Path "$source\tesseract.exe")) { throw "Tesseract не установлен на агенте" }

          $target = "dist/DocRenamer/runtime/tesseract"
          New-Item -ItemType Directory -Force -Path "$target/tessdata" | Out-Null
          Copy-Item "$source\*" $target -Recurse -Force -Exclude "tessdata"

          # Языковые данные: быстрый набор, русский и английский (раздел 16 ТЗ).
          $base = "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main"
          foreach ($lang in @("rus", "eng", "osd")) {
            Invoke-WebRequest "$base/$lang.traineddata" -OutFile "$target/tessdata/$lang.traineddata"
          }

          New-Item -ItemType Directory -Force -Path dist/DocRenamer/LICENSES | Out-Null
          if (Test-Path "$source\LICENSE") {
            Copy-Item "$source\LICENSE" "dist/DocRenamer/LICENSES/tesseract-Apache-2.0.txt" -Force
          }

          $env:TESSDATA_PREFIX = "$target/tessdata"
          $languages = & "$target/tesseract.exe" --list-langs 2>&1 | Out-String
          Write-Host $languages
          if ($languages -notmatch "rus" -or $languages -notmatch "eng") {
            throw "Языковые данные rus/eng не подхватились"
          }

      - name: Дополнить portable-каталог
        shell: pwsh
        run: |
          $dist = "dist/DocRenamer"
          New-Item -ItemType Directory -Force -Path "$dist/config","$dist/models",
            "$dist/logs","$dist/manifests","$dist/runtime_temp","$dist/LICENSES" | Out-Null
          Copy-Item config/*.json "$dist/config/" -Force
          Copy-Item README.md,THIRD_PARTY_NOTICES.md,LICENSE "$dist/" -Force
          Copy-Item runtime/README.md "$dist/КУДА-КЛАСТЬ-КОМПОНЕНТЫ.txt" -Force
          if (Test-Path dist/updater/DocRenamerUpdate.exe) {
            Copy-Item dist/updater/DocRenamerUpdate.exe "$dist/" -Force
          }

      - name: Проверить, что собранное приложение запускается
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path проверка | Out-Null
          Set-Content -Path "проверка/договор.txt" -Encoding UTF8 -Value @"
          ДОГОВОР ЗАЙМА № 17
          город Москва, 18 августа 2026 года
          Займодавец ООО «Альфа», Заёмщик Петров Сергей Андреевич
          "@
          & "dist/DocRenamer/DocRenamer.exe" "проверка" | Tee-Object -Variable out
          if (-not ($out -match "Договор")) { throw "Приложение не распознало тестовый документ" }
          & "dist/onefile/DocRenamer.exe" "проверка" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Однофайловая сборка завершилась с ошибкой" }
          if (Get-ChildItem "проверка" | Where-Object { $_.Name -ne "договор.txt" }) {
            throw "Предпросмотр изменил файлы, чего быть не должно"
          }

      - name: Проверить, что графическое окно собирается
        continue-on-error: true
        shell: pwsh
        run: |
          $code = @'
          import tkinter, docrenamer.gui as gui
          from docrenamer.config import Config
          from docrenamer.paths import default_paths
          window = gui.DocRenamerGUI(Config(), default_paths(), None)
          window.root.update_idletasks()
          assert window.tree.winfo_exists() and window.log.winfo_exists()
          window.root.destroy()
          print("Окно собирается без ошибок")
          '@
          $code | Out-File -Encoding utf8 gui_check.py
          python gui_check.py

      - name: Собрать установщик
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup не найден на агенте — установщик не собирается"
            exit 0
          }
          & $iscc installer\DocRenamer.iss
          if (-not (Test-Path "dist/installer/DocRenamer-Setup.exe")) {
            throw "Установщик не собран"
          }
          Get-Item dist/installer/DocRenamer-Setup.exe | Select-Object Name, Length

      - name: Приложить файлы к релизу
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Compress-Archive -Path dist/DocRenamer/* -DestinationPath DocRenamer-portable.zip -Force
          Copy-Item dist/onefile/DocRenamer.exe DocRenamer.exe -Force
          if (Test-Path dist/installer/DocRenamer-Setup.exe) {
            Copy-Item dist/installer/DocRenamer-Setup.exe DocRenamer-Setup.exe -Force
          }
          Get-ChildItem DocRenamer-Setup.exe,DocRenamer.exe,DocRenamer-portable.zip -ErrorAction SilentlyContinue |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content SHA256SUMS.txt -Encoding ASCII

      - name: Создать релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DocRenamer-Setup.exe
            DocRenamer.exe
            DocRenamer-portable.zip
            SHA256SUMS.txt
          body: |
            Переименование документов, фотографий и почты по их содержимому. Работает полностью офлайн.

            ## Скачайте ОДИН файл — какой именно, зависит от того, что вам удобнее

            | Файл | Кому подойдёт | Что делать после скачивания |
            |---|---|---|
            | **`DocRenamer-Setup.exe`** | Большинству. | Запустить. Программа установится сама, появится значок на рабочем столе и пункт «Переименовать файлы» в меню папки. |
            | `DocRenamer.exe` | Если ставить ничего не хотите — например, работаете с флешки. | Положить в любую свою папку, например `C:\DocRenamer\`, и запустить оттуда. |
            | `DocRenamer-portable.zip` | Если планируете добавить распознавание сканов и локальную модель. | Распаковать целиком в любую папку и запускать `DocRenamer.exe` изнутри неё. |

            **Скачивать всё сразу не нужно.** Это три способа получить одну и ту же программу.

            `SHA256SUMS.txt` — контрольные суммы, нужны только если хотите убедиться, что файл скачался без искажений: `certutil -hashfile DocRenamer.exe SHA256`.

            ## Куда программа кладёт свои файлы

            Рядом с собой, в ту же папку, откуда вы её запустили:

            ```text
            DocRenamer.exe
            logs\        журналы: что и почему было переименовано
            manifests\   данные для отмены
            ```

            Поэтому не запускайте программу прямо из папки «Загрузки» — положите её в отдельную папку.
            Если вы ставили `DocRenamer-Setup.exe`, об этом думать не нужно: установщик всё разложил сам.

            Распознавание сканов (Tesseract, русский и английский) уже внутри установщика и
            portable-архива — доустанавливать ничего не нужно. Отдельно скачанный
            `DocRenamer.exe` работает без распознавания: ему нужен архив или установщик.

            ## Если захотите локальную модель и дополнительные форматы

            Их нужно доложить **в ту же папку, где лежит программа**:

            ```text
            C:\DocRenamer\
            ├── DocRenamer.exe
            ├── models\
            │   └── document-model.gguf        локальная языковая модель
            └── runtime\
                ├── tesseract\                 уже вложено в сборку
                ├── exiftool\exiftool.exe      RAW-фото и XMP
                ├── ffmpeg\ffprobe.exe         AVI, MKV, WEBM
                └── 7zip\7z.exe                просмотр 7Z и RAR
            ```

            Где всё это взять — в файле `runtime\README.md` внутри архива. Программа ничего не скачивает сама: если компонента нет, она просто напишет об этом в журнале и продолжит работать.

            Проверить, что подключилось: кнопка **«Самопроверка»** в окне программы.

            ## Как пользоваться

            Открыть программу → выбрать папку → «Предпросмотр» → посмотреть предложенные имена → «Переименовать».
            Отменить последнюю операцию можно кнопкой «Отменить».

            Имена строятся так, чтобы файлы было удобно сортировать: сначала вид документа, дата в конце.

            ```text
            Постановление_СПИ_Иванов_652102_26_77028-ИП_27.07.2026.pdf
            Договор_Петров_ООО_Альфа_17_18.08.2026.docx
            Фото_iPhone_16_Pro_03.08.2026_18.42.17.jpg
            ```

            ## Гарантии

            - содержимое файлов не меняется — только имя, SHA-256 сверяется до и после;
            - существующие файлы не перезаписываются, ничего не удаляется и не переносится в другие папки;
            - по умолчанию программа только показывает предложения и ничего не меняет;
            - любую операцию можно отменить;
            - документы никуда не отправляются: программа обработки документов не содержит сетевого кода вообще, это проверяется при каждой сборке.

      - name: Артефакт — один файл
        uses: actions/upload-artifact@v4
        with:
          name: DocRenamer-onefile
          path: dist/onefile/DocRenamer.exe
          if-no-files-found: error
        continue-on-error: true

      - name: Артефакт — portable-каталог
        uses: actions/upload-artifact@v4
        with:
          name: DocRenamer-portable
          path: dist/DocRenamer/
          if-no-files-found: error
        continue-on-error: true
